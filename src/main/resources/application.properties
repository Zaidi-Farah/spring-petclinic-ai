# database init, supports mysql too
database=h2

spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl

# Internationalization
spring.messages.basename=messages/messages

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.azure=DEBUG
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# Azure OpenAI
# These parameters only apply when using the spring-ai-starter-model-azure-openai dependency
spring.ai.azure.openai.chat.options.model=gpt-4o
spring.ai.azure.openai.api-key=${AZURE_OPENAI_KEY}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}

# OpenAI
# These parameters only apply when using the spring-ai-starter-model-openai dependency
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:0.5b-instruct

logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.http=DEBUG

spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http://localhost:3000/api/public/otel
management.otlp.tracing.headers.Authorization=Basic ${LANGFUSE_AUTH}
management.otlp.tracing.headers.x-langfuse-ingestion-version=4


